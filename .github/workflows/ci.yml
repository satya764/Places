      - name: Build and test
        run: |
          xcodebuild test \
            -project Places.xcodeproj \
            -scheme Places \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
          || xcodebuild test \
            -project Places.xcodeproj \
            -scheme Places \
            -sdk iphonesimulator \
            -destination generic/platform=iOS\ Simulator \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
